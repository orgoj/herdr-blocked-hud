# herdr-blocked-hud settings: ~/.config/herdr-blocked-hud/config.toml
# Every key is optional; the values below are the defaults.

# Seconds between polls of the Herdr sessions.
poll_interval = 1.0

# Exact `wmctrl -lx` class of the Herdr terminal window, used when the
# process tree finds no window (e.g. a terminal mux) and no other session
# has a client, since a class cannot tell sessions apart. "" disables it.
wm_class = "herdr.herdr"

# Sounds: "builtin" is the HUD's own sound (blocked and done differ), a
# file path is played with paplay, "" disables that sound.
blocked_sound = "builtin"
done_sound = "builtin"

# Placement on the primary monitor: top-right, top-left, bottom-right,
# bottom-left; margins in pixels from that corner; window width in pixels.
corner = "top-right"
margin_x = 24
margin_y = 36
width = 320

[done]
# List agents that stay done (finished, not yet viewed) this many seconds.
after_seconds = 5
# Play done_sound when an agent enters a Done section.
sound_enabled = true
# The bottom-most line matching this regex is the agent's status line; its
# first group is the status value, and each value gets its own Done section.
status_regex = '^\s*STATUS:\s*(\S+)'
# What happens to a row, per status value:
#   "transient": it leaves once you view the pane (Herdr marks it seen)
#   "sticky":    it stays until the agent works again or you dismiss it
#   "hide":      it is never listed
# default_mode covers values not in [done.modes]; no_status_mode covers a
# reply without a status line (or a failed read).
default_mode = "transient"
no_status_mode = "transient"
# Rendered rows read from the agent's pane (once per completion).
read_lines = 80

[done.modes]
# Example: DONE = "transient" with default_mode = "sticky" keeps every
# other status value listed until the agent works again.
