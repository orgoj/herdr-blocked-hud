[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "herdr-blocked-hud"
version = "0.1.2"
description = "Always-on-top X11 HUD for blocked and long-done Herdr agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Heca" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
herdr-blocked-hud = "herdr_blocked_hud.app:main"

[tool.hatch.build.targets.wheel]
packages = ["herdr_blocked_hud"]
